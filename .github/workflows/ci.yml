name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELLCHECK_VERSION: v0.11.0
  BATS_VERSION: v1.11.1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned shellcheck
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJ
          sudo cp "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/
          shellcheck --version
      - name: shellcheck
        run: shellcheck -x bin/bashedlogs lib/core/*.sh lib/formats/*.sh tools/*.sh
      - name: bash -n
        run: |
          bash -n bin/bashedlogs
          for f in lib/core/*.sh lib/formats/*.sh tools/*.sh; do bash -n "$f"; done

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned bats-core
        run: |
          git clone --depth 1 -b "${BATS_VERSION}" https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
          echo "$RUNNER_TEMP/bats/bin" >> "$GITHUB_PATH"
      - name: Run suite (GNU userland, bash 5)
        run: |
          bash --version | head -1
          bats tests/

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install modern bash + bats
        run: brew install bash bats-core
      - name: Run suite (BSD userland, brew bash)
        run: |
          bash --version | head -1
          bats tests/
      - name: Stock bash 3.2 hits the version guard cleanly
        run: |
          set +e
          out=$(/bin/bash bin/bashedlogs --version 2>&1)
          code=$?
          set -e
          test "$code" -eq 1
          echo "$out" | grep -q "bash 4.0+ required"

  floor-bash4:
    # True floor check: bash 4.0 + busybox userland (awk/sort/head portability).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build artifact
        run: tools/build.sh
      - name: Tree + artifact run under bash 4.0 / busybox
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo bash:4.0 bash -ec '
            bash --version | head -1
            ./bin/bashedlogs -o json tests/fixtures/generic/mixed.log | grep -q "\"format\":\"generic\""
            ./dist/bashedlogs -o json tests/fixtures/generic/mixed.log | grep -q "\"threat\""
            rc=0; ./dist/bashedlogs --fail-level high tests/fixtures/generic/mixed.log >/dev/null || rc=$?
            test "$rc" -eq 3
            ./dist/bashedlogs --fail-level low tests/fixtures/generic/clean.log >/dev/null
            for bl in ./bin/bashedlogs ./dist/bashedlogs; do
              out=$("$bl" --iocs -o json tests/fixtures/auth/normal.log)
              case $out in *"\"domains\":[],\"urls\":[],\"hashes\":{\"md5\":[],"*) ;; *) echo "$bl: empty IOC list not []"; exit 1 ;; esac
              rc=0; out=$("$bl" 2>&1) || rc=$?
              test "$rc" -eq 1
              case $out in *"Usage:"*) ;; *) echo "$bl: no usage without arguments"; exit 1 ;; esac
              # SSH source attribution is all awk string work, so busybox awk
              # gets its own check: no client-supplied address in the report,
              # the real source on both the burst and the forged tag, and a
              # real burst still counted behind a rewritten tag and stacked
              # message prefixes, which are the two ways it can go silent.
              out=$("$bl" -o json --bf-threshold 5 --bf-window 300 tests/fixtures/regressions/ssh-framed-user.log)
              case $out in *198.51.100.7*) echo "$bl: framed address in report"; exit 1 ;; esac
              case $out in *"203.0.113.66 (12)"*) ;; *) echo "$bl: wrong brute-force source"; exit 1 ;; esac
              out=$("$bl" -o json tests/fixtures/regressions/ssh-framed-tag.log)
              case $out in *"\"top_attacking_ips\":\"203.0.113.77 (1)\""*) ;; *) echo "$bl: forged tag counted"; exit 1 ;; esac
              out=$("$bl" -o json --bf-threshold 5 --bf-window 300 tests/fixtures/regressions/ssh-rewritten-tag.log)
              case $out in *"203.0.113.88 (6)"*) ;; *) echo "$bl: rewritten tag hid a burst"; exit 1 ;; esac
              out=$("$bl" -o json --bf-threshold 5 --bf-window 300 tests/fixtures/regressions/ssh-stacked-prefix.log)
              case $out in *"203.0.113.99 (6)"*) ;; *) echo "$bl: stacked prefix swallowed failures"; exit 1 ;; esac
            done
          '
      - name: Control bytes escaped in bounded time under bash 4.0 / busybox
        # bash 4.0 runs ${v//x/y} in superlinear time, and busybox od/awk carry
        # the linear rewrite, so both halves of the pretty sanitizer are checked here.
        # BEL and a UTF-8 C1 CSI ride in front of the ESC run on every line.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo bash:4.0 bash -ec '
            esc=$(printf "\033") bel=$(printf "\007") csi=$(printf "\302\233") p=""
            for ((k = 0; k < 2600; k++)); do p="$p${esc}[A"; done
            for s in 1 2 3 4 5; do
              printf "203.0.113.66 - - [01/Jun/2025:10:00:0%s +0000] \"GET /%s%s%s%s HTTP/1.1\" 404 0 \"-\" \"curl/8.0\"\n" "$s" "$s" "$bel" "$csi" "$p"
            done > /tmp/dense.log
            for bl in ./bin/bashedlogs ./dist/bashedlogs; do
              start=$SECONDS
              out=$("$bl" --no-color /tmp/dense.log)
              echo "$bl: $((SECONDS - start))s"
              test $((SECONDS - start)) -lt 20
              case $out in *"$esc"* | *"$bel"* | *"$csi"*) echo "raw control byte in pretty output"; exit 1 ;; esac
              case $out in *"/1\\x07\\xc2\\x9b\\x1b[A\\x1b[A"*) ;; *) echo "BEL, CSI or ESC not shown as text"; exit 1 ;; esac
            done
          '

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned shellcheck
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJ
          sudo cp "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/
      - name: Install pinned bats-core
        run: |
          git clone --depth 1 -b "${BATS_VERSION}" https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
          echo "$RUNNER_TEMP/bats/bin" >> "$GITHUB_PATH"
      - name: Build single-file artifact
        run: tools/build.sh
      - name: shellcheck the artifact
        run: shellcheck dist/bashedlogs
      - name: Run full suite against the artifact
        run: BASHEDLOGS_UNDER_TEST="$PWD/dist/bashedlogs" bats tests/
      - uses: actions/upload-artifact@v4
        with:
          name: bashedlogs-single-file
          path: dist/bashedlogs
